[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "motorrijtuigenbelasting"
version = "0.1.0"
description = "Calculate Dutch road tax Motorrijtuigenbelasting(MRB) for vehicles."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
    {name = "Vito Minheere", email = "vito@vipyr.nl"}
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent"
]

dependencies = []

[project.optional-dependencies]
dev = ["ruff", "black"]

[project.urls]
"Source Code" = "https://github.com/VitoMinheere/motorrijtuigenbelasting"
"Issue Tracker" = "https://github.com/VitoMinheere/motorrijtuigenbelasting/issues"

[tool.setuptools.packages.find]
include = ["motorrijtuigenbelasting*"]

[tool.setuptools.package-data]
motorrijtuigenbelasting = ["data/*.json"]

[tool.ruff]
target-version = "py310"
