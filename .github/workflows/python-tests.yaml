name: Python Tests

on:
  push:
    branches:
      - main
  pull_request:  # Run this workflow for pull requests
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Step 3: Install the package with its dev dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      # Step 4: Run tests and fail when coverage drops below the minimum
      - name: Run unittest with coverage
        run: |
          coverage run -m unittest discover -s tests
          coverage report

      # Step 5: Check linting, without fixing so problems fail the build
      - name: Run Ruff
        run: ruff check .

      # Step 6: Check code style with black
      - name: Check code formatting with Black
        run: black --check .

      # Step 7: Check types
      - name: Run mypy
        run: mypy
